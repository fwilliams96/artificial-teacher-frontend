<main class="main">
    <div class="page-content">
        <div class="container-small d-flex flex-column justify-content-center align-items-center">
            <h1 class="mb-5">Mis rutinas</h1>

            <p class="" *ngIf="routines.length == 0">Aún no tienes rutinas, prueba a crear una 😁</p>

            <div class="d-grid cards" *ngIf="routines">
                <div *ngFor="let routine of routines; let i = index" class="card border-primary mb-3"
                [ngClass]="i%2 === 0 ? 'border-primary': 'bg-primary'" 
                style="max-width: 18rem;">
                    <a [routerLink]="['/my-routine', routine.id]">
                        <div class="card-body" [ngClass]="i%2 === 0 ? 'text-primary': 'text-white'">
                            <h5 class="card-title" [ngClass]="i%2 === 0 ? '': 'text-white'">Rutina {{ i+1 }}</h5>
                            <p class="card-text">{{ routine.topic }}</p>
                        </div>
                    </a>
                </div>
                
            </div>

            <button class="btn btn-primary" (click)="createRoutine()">Crear rutina</button>
        </div>
    </div>
</main>
